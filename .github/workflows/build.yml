name: Build CSPB Full

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Compile NDK
        run: |
          for mk in $(find . -name "Android.mk"); do
            echo "Building: $(dirname "$mk")"
            ndk-build -C "$(dirname "$mk")" APP_ABI=arm64-v8a
          done

      - name: Kumpulkan Semua File
        run: |
          mkdir -p output/lib/xash output/lib/menu
          
          # Mencari dan memindahkan file berdasarkan nama
          # Menggunakan wildcard agar tidak terpengaruh nama file yang spesifik
          find . -type f -name "*xash*.so" -exec cp {} output/lib/xash/ \;
          find . -type f -name "*menu*.so" -exec cp {} output/lib/menu/ \;
          
          # Backup semua .so lainnya ke folder output
          find . -type f -name "*.so" -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lengkap_CSPB
          path: output/
          
