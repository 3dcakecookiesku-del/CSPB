name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Langkah Kompilasi C++ (ndk-build)
      - name: Build C++ with NDK
        run: ndk-build
        # Jika file jni berada di sub-direktori, tambahkan: working-directory: ./nama_folder

      # Langkah Build APK (Gradle)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      # Langkah Mengunggah APK (Menggunakan v4)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSPB_Final_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
