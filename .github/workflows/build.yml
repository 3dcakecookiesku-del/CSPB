name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Instalasi NDK
      - name: Install Android NDK
        run: echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
        
      # Kompilasi C++ dengan jalur eksplisit
      # Ganti "." dengan "./app" jika folder jni Anda berada di dalam folder 'app'
      - name: Build C++ with NDK
        run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk
        
      # Build APK
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      # Upload Artifact v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSPB_Final_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
