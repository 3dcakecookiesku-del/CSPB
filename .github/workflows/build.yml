name: Build APK dari Source C++

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Structure
        run: |
          mkdir -p app/src/main/jni
          unzip PB.zip -d app/src/main/
          
          # Membuat settings.gradle
          echo "include ':app'" > settings.gradle
          
          # Membuat Root build.gradle
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # Membuat app/build.gradle
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 33
              namespace "com.example.cspb"
              defaultConfig {
                  applicationId "com.example.cspb"
                  minSdk 21
                  targetSdk 33
              }
              externalNativeBuild {
                  ndkBuild {
                      path "src/main/jni/Android.mk"
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          # Kita gunakan perintah 'gradle' langsung, bukan './gradlew'
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSPB_Final_APK
          path: app/build/outputs/apk/debug/app-debug.apk
