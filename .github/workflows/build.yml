name: Build CS PB 64-bit NDK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract JNI
      run: |
        if [ -f jni.zip ]; then
          unzip -o jni.zip
        elif [ -f JNI.zip ]; then
          unzip -o JNI.zip
        fi

    - name: Compile NDK (arm64-v8a)
      run: |
        if [ -d "jni" ]; then
          cd jni
          $ANDROID_NDK_LATEST_HOME/ndk-build
        else
          $ANDROID_NDK_LATEST_HOME/ndk-build
        fi

        - name: Upload Output SO Files
      uses: actions/upload-artifact@v4
      with:
        name: CS_PB_64bit_Libs
        path: |
          libs/
          jni/libs/
          **/libxash.so
          **/libmenu.so
          **/libclient.so
          **/libserver.so
          
          
