android {
    // ... konfigurasi lainnya ...

    defaultConfig {
        // ... konfigurasi lainnya ...

        // Ini memberitahu sistem untuk menyertakan library dari folder jniLibs
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // Pastikan sourceSets diarahkan ke folder tempat Anda meletakkan folder libs tadi
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
