name: Build CSPB Final

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Ekstrak File
        run: |
          # Membuka file zip agar folder jni keluar
          unzip -o jni.zip

      - name: Compile NDK
        run: |
          # Sekarang folder jni sudah ada, kita bisa langsung build
          ndk-build -C jni APP_ABI=arm64-v8a

      - name: Kumpulkan Hasil
        run: |
          mkdir -p output/libs/arm64-v8a
          # Ambil hasil .so dari folder jni/libs
          cp -r jni/libs/arm64-v8a/*.so output/libs/arm64-v8a/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib_CSPB
          path: output/
          
