name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # LANGKAH BARU: Ekstrak file zip
      - name: Extract project files
        run: unzip PB.zip -d extracted_project

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"

      # Sekarang kita arahkan ke dalam folder hasil ekstraksi
      - name: Build C++ with NDK
        run: |
          ${ANDROID_HOME}/ndk/25.1.8937393/ndk-build NDK_PROJECT_PATH=./extracted_project APP_BUILD_SCRIPT=./extracted_project/jni/Android.mk

      - name: Build APK
        run: |
          chmod +x extracted_project/gradlew
          ./extracted_project/gradlew assembleDebug -p extracted_project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSPB_Final_APK
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
          
