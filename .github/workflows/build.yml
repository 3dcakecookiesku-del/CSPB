name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"

      # LANGKAH PENTING: Mencari letak file Android.mk
      - name: Temukan file Android.mk
        run: find . -name "Android.mk"

      - name: Build C++ dengan NDK
        run: |
          # JANGAN DIUBAH DULU, JALANKAN SAJA
          ${ANDROID_HOME}/ndk/25.1.8937393/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSPB_Final_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
