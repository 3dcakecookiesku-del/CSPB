name: Build Lib Official

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Source
        run: |
          mkdir -p jni/xash jni/menu
          git clone --depth 1 https://github.com/FWGS/xash3d-fwgs jni/xash
          git clone --depth 1 https://github.com/FWGS/xash-extras jni/menu

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Build
        run: |
          cd jni
          ndk-build APP_ABI=arm64-v8a

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib
          path: libs/arm64-v8a/*.so
          
