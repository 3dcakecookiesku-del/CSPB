name: Build Minimal

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Build
        run: ndk-build -C jni APP_ABI=arm64-v8a

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib
          path: libs/arm64-v8a/*.so
          
