name: Build CSPB Complete

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Compile NDK
        run: |
          for mk in $(find . -name "Android.mk"); do
            echo "Memproses: $(dirname "$mk")"
            ndk-build -C "$(dirname "$mk")" APP_ABI=arm64-v8a
          done

      - name: Susun Hasil Lib
        run: |
          # Buat folder struktur lib/xash dan lib/menu
          mkdir -p output/lib/xash output/lib/menu

          # Masukkan file engine ke folder lib/xash
          find . -type f -name "*xash*.so" -exec cp {} output/lib/xash/ \;

          # Masukkan file menu ke folder lib/menu
          find . -type f -name "*menu*.so" -exec cp {} output/lib/menu/ \;

          # Salin juga SEMUA file .so ke root output sebagai cadangan
          find . -type f -name "*.so" -exec cp {} output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib_CSPB
          path: output/
          
