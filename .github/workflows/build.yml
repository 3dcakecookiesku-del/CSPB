name: Build CSPB Final

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Ekstrak File
        run: unzip -o jni.zip

      - name: Compile NDK
        run: ndk-build -C jni APP_ABI=arm64-v8a

      - name: Cari Lokasi File
        run: |
          echo "Mencari semua file .so yang baru saja dibuat:"
          find . -name "*.so"
          
          echo "--- ISI FOLDER JNI ---"
          ls -R jni/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug_Hasil_Build
          path: .  # Ini akan mengupload semua file agar kita bisa cek isinya
          
