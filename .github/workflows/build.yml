name: Build CSPB Terorganisir

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Build
        run: |
          # Build semua yang ada
          for mk in $(find . -name "Android.mk"); do
            ndk-build -C "$(dirname "$mk")" APP_ABI=arm64-v8a
          done

      - name: Atur Folder
        run: |
          mkdir -p output/lib/xash output/lib/menu
          # Pindahkan file berdasarkan nama (sesuaikan nama file jika berbeda)
          # Menggunakan find untuk mencari file .so
          find . -name "libxash.so" -exec cp {} output/lib/xash/ \;
          find . -name "libmenu.so" -exec cp {} output/lib/menu/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib_CSPB
          path: output/
          
