name: Build CSPB Final

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Ekstrak File
        run: unzip -o jni.zip

      - name: Compile NDK
        run: ndk-build -C jni APP_ABI=arm64-v8a

      - name: Ambil Semua File .so (Apapun Lokasinya)
        run: |
          mkdir -p output
          # Perintah ini mencari SEMUA file .so di semua folder dan memindahkannya ke output
          find . -name "*.so" -exec cp {} output/ \;
          echo "Daftar file yang berhasil dikumpulkan:"
          ls -l output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib_CSPB_Lengkap
          path: output/
          
