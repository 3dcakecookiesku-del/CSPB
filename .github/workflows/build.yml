name: Build CS PB 64-bit NDK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Compile NDK
        run: |
          ndk-build -C jni

          - name: Upload Output SO Files
      uses: actions/upload-artifact@v4
      with:
        name: CS_PB_64bit_Libs
        path: |
          libs/arm64-v8a/*.so
          jni/libs/arm64-v8a/*.so
          
          
