name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Langkah baru: Menginstal NDK
      - name: Install Android NDK
        run: echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
        
      # Menambahkan path NDK agar dikenali
      - name: Add NDK to PATH
        run: echo "PATH=$PATH:${ANDROID_HOME}/ndk/25.1.8937393" >> $GITHUB_ENV

      # Langkah Kompilasi C++
      - name: Build C++ with NDK
        run: ndk-build
        # Jika file jni berada di sub-folder, tambahkan: working-directory: ./nama_folder

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSPB_Final_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
