name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Android NDK
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"

      - name: Extract, Debug, and Build
        run: |
          # 1. Ekstrak file
          mkdir extracted_project
          unzip PB.zip -d extracted_project
          
          # 2. DEBUG: Tampilkan isi file supaya kita tahu struktur foldernya
          echo "--- STRUKTUR FOLDER ---"
          find extracted_project -maxdepth 3
          
          # 3. Cari lokasi Android.mk secara otomatis
          echo "--- LOKASI Android.mk ---"
          find extracted_project -name "Android.mk"
          
          # 4. Build C++ (Kita akan sesuaikan setelah melihat hasil log ini)
          # Untuk sekarang, kita biarkan kosong agar tidak error dulu
          
          # 5. Build APK
          chmod +x extracted_project/gradlew
          ./extracted_project/gradlew assembleDebug -p extracted_project
          
