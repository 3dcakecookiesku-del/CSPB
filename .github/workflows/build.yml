name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract project files
        run: |
          mkdir extracted_project
          unzip PB.zip -d extracted_project
          # DEBUG: Melihat isi file setelah diekstrak
          ls -R extracted_project

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393"

      # Kita lewati dulu langkah build untuk melihat isi folder
      - name: Cek Lokasi File
        run: echo "Cek log di atas untuk melihat lokasi gradlew atau Android.mk"
        
