name: Build CSPB APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. Langkah Kompilasi C++ (ndk-build)
      - name: Build C++ with NDK
        run: ndk-build
        # Pastikan perintah ini dijalankan di direktori yang benar, 
        # tambahkan 'working-directory: ./nama_folder_jni' jika perlu

      # 2. Langkah Build APK (Gradle)
      - name: Build APK
        run: ./gradlew assembleDebug

      # 3. Langkah Mengunggah APK
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: CSPB_Final_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
