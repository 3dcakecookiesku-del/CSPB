name: Build Lib Official

on: [push] # Otomatis jalan saat kamu klik "Push" ke GitHub

jobs:
  build:
    runs-on: ubuntu-latest # Menggunakan server Ubuntu terbaru
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4 # Mengambil file yang sudah kamu upload di repo

      - name: Ambil Source Official
        run: |
          # Membuat folder agar tidak berantakan
          mkdir -p jni/official
          # Mendownload source official dari GitHub FWGS
          git clone https://github.com/FWGS/xash3d-fwgs jni/official/xash
          git clone https://github.com/FWGS/xash-extras jni/official/menu
          
      - name: Setup NDK
        uses: nttld/setup-ndk@v1 # Menyiapkan mesin compiler NDK
        with:
          ndk-version: r21e # Versi NDK yang stabil untuk game engine

      - name: Compile dengan NDK
        # Memulai proses pembuatan libxash.so dan libmenu.so
        run: ndk-build -C jni APP_ABI=arm64-v8a

      - name: Upload Hasil Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Lib_Final
          # Mencari semua file .so yang berhasil dibuat dan menyimpannya sebagai ZIP
          path: |
            libs/arm64-v8a/*.so
            obj/local/arm64-v8a/*.so
            
