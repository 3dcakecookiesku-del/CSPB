name: Build Lib Official

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Persiapan Source Official
        run: |
          mkdir -p jni/xash jni/menu
          # Mengambil source official FWGS
          git clone --depth 1 https://github.com/FWGS/xash3d-fwgs jni/xash
          git clone --depth 1 https://github.com/FWGS/xash-extras jni/menu

      - name: Compile
        run: |
          cd jni
          ndk-build APP_ABI=arm64-v8a

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Hasil_Build
          path: libs/arm64-v8a/*.so
          
